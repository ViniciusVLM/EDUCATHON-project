<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Copiloto Pedagógico com IA — Automatize a correção de atividades dissertativas com feedbacks individualizados e controle total do professor." />
    <meta name="theme-color" content="#6c63ff" />
    <title>Educathon — Copiloto Pedagógico com IA</title>

    <!--
      Script anti-flash: aplica o tema salvo ANTES de qualquer renderização React.
      Deve ser inline (não defer/async) para rodar antes do primeiro paint.
    -->
    <script>
      (function () {
        var STORAGE_KEY = 'educathon_theme';
        var theme = 'light';
        try {
          var saved = localStorage.getItem(STORAGE_KEY);
          if (saved === 'dark' || saved === 'light') {
            theme = saved;
          } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            theme = 'dark';
          }
        } catch (_) {}
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
