name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ──────────────────────────────────────────
  # Backend: lint + testes
  # ──────────────────────────────────────────
  server:
    name: Server (lint + tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Lint
        working-directory: server
        run: npm run lint

      - name: Unit tests (parser)
        working-directory: server
        run: npm run test:unit

      - name: Integration tests (routes)
        working-directory: server
        run: npm run test:integration

  # ──────────────────────────────────────────
  # Frontend: typecheck + lint + testes + build
  # ──────────────────────────────────────────
  client:
    name: Client (typecheck + lint + tests + build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Type check
        working-directory: client
        run: npx tsc --noEmit

      - name: Lint
        working-directory: client
        run: npm run lint

      - name: Tests
        working-directory: client
        run: npm test

      - name: Build
        working-directory: client
        run: npm run build
